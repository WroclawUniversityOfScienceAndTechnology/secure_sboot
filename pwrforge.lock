[project]
name = "bootloader"
version = "0.1.0"
description = "Secure fail-safe secondary boorloader"
homepage-url = "pwrforge.pwr.edu.pl"

bin_name = "bootloader"
target = ["stm32"]
build-env = "docker"
docker-file = ".devcontainer/Dockerfile-custom"
docker-image-tag = "sboot-dev:1.0"

cxxstandard = "17"

cflags   = "-Wall -Wextra"
cxxflags = "-Wall -Wextra"

src_extensions = [".c", ".cpp", ".cxx", ".cc", ".s", ".S", ".asm"]
header_extensions = [".h", ".hpp", ".hxx", ".hh", ".inc", ".inl"]

in-repo-conan-cache = false

[profile.Debug]
cflags   = "-g"
cxxflags = "-g"

[profile.Release]
cflags   = "-O3 -DNDEBUG"
cxxflags = "-O3 -DNDEBUG"

[profile.RelWithDebInfo]
cflags   = "-O2 -g -DNDEBUG"
cxxflags = "-O2 -g -DNDEBUG"

[profile.MinSizeRel]
cflags   = "-Os -DNDEBUG"
cxxflags = "-Os -DNDEBUG"

[profile.Firmware]
cmake-build-type = "MinSizeRel"
cflags = "-Os -g -DNDEBUG"
cxxflags = "-Os -g -DNDEBUG"

[check]
exclude = []

[check.pragma]
exclude = []

[check.copyright]
description = '@copyright Copyright \(C\) \d{4} .* All rights reserved.'
exclude = []

[fix.copyright]
description = '''
/**
 * @copyright Copyright (C) 2025 <Company-Name>. All rights reserved.
 */
'''

[check.todo]
keywords = ["tbd", "todo", "TODO", "fixme"]
exclude = []

[check.cppcheck]
directories = [
    "src/",
    "main/",
]
suppress = [
#    "unusedFunction",
    "missingIncludeSystem",
    "unmatchedSuppression"
]

[check.clang-format]
exclude = []

[check.clang-tidy]
exclude = []

[check.cyclomatic]
exclude = []

[check.license]
blacklist = ["GPL-3.0", "AGPL-3.0"]
whitelist = ["MIT", "BSD-2-Clause", "Apache-2.0"]
allow-no-license-if-copyright-match = [
    "MyCompany"
]

[tests]
cc  = "gcc"
cxx = "g++"

cflags   = "-Wall -Wextra -O0 --coverage -fkeep-inline-functions -fkeep-static-consts"
cxxflags = "-Wall -Wextra -O0 --coverage -fkeep-inline-functions -fkeep-static-consts"

gcov-executable = "" # Empty string -> use default gcov executable

# Underhood pwrforge use conan. All string valid for conan tool are valid here. eg "gtest/1.13.0"
[dependencies]
#general -> public conan dependencies of project they will be added to package info (eg. bianry dynamic linkage libary) they will be added also to pwrforge test.
general = [
]
#build -> private conan dependencies usedn only during build process(eg. private static linkage library)
build = [
]
#tool -> special conan "not library" dependencies like cmake/3.22.
tool = [
]
#test-> conan dependencies used only for testing targets
test = [
    "gtest/1.13.0"
]

[conan.repo]
#Passing conancenter here is not nessary as pwrforge adds it by default
#Below example of private binary artifacts repository
#my_artifactory = "https://my_artifactory/api/conan/conanlocal"

[stm32]
chip = "STM32F103C8T6"
flash-start = 0x08000000


[pwrforge]
console-log-level = "INFO"
file-log-level = "ERROR"
update-exclude = ["src/CMakeLists.txt", "config/conan/profiles/stm32_Firmware"]
version = "0.1.1"

[docker-compose]
ports = []
