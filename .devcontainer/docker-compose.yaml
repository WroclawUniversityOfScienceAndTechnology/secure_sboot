name: pwrforge-sboot-bootloader-article_1-0-0-acb1f75487b8
services:
  bootloader_dev:
    image: sboot-dev:1.0
    platform: linux/amd64
    build:
      context: .
      # in case of missing .env file (eg. CI/CD) system will use default values
      args:
        GID_NUMBER: ${GID_NUMBER:-1000}
        UID_NUMBER: ${UID_NUMBER:-1000}
        DOCKER_IMAGE_ROOT: ${DOCKER_IMAGE_ROOT:-ubuntu:24.04}
        CONAN_LOGIN_USERNAME: ${CONAN_LOGIN_USERNAME:-""}
        CONAN_PASSWORD: ${CONAN_PASSWORD:-""}
    privileged: true
    group_add:
      - "12"
      - "33"
      - "61"
      - "79"
      - "80"
      - "81"
      - "98"
      - "100"
      - "101"
      - "204"
      - "250"
      - "395"
      - "398"
      - "399"
      - "400"
      - "701"
      - "999"
    volumes:
      - ..:/workspace
      - /dev:/dev
      - pwrforge_stm32cube_cache:/home/ubuntu/.cache/pwrforge/stm32cube
    command: sleep infinity
    ports:
      - "3333:3333"
      - "4444:4444"
      - "6666:6666"
volumes:
  pwrforge_stm32cube_cache:
    name: pwrforge_stm32cube_cache
